<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- corner labels, like the reference site's header/footer -->
  <text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#8a8a8a">SRUTHY-KANTH</text>
  <text x="1160" y="40" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#8a8a8a">AI ENGINEERING STUDENT</text>

  <!-- thin rule -->
  <line x1="40" y1="58" x2="1160" y2="58" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Hello I'm -->
  <text x="40" y="150" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="4" fill="#b5b5b5">HELLO I'M</text>

  <!-- Big stacked name -->
  <text x="36" y="255" font-family="Helvetica, Arial, sans-serif" font-size="110" font-weight="800" letter-spacing="2" fill="url(#accent)">SRUTHY</text>
  <text x="36" y="365" font-family="Helvetica, Arial, sans-serif" font-size="110" font-weight="800" letter-spacing="2" fill="url(#accent)">KANTH</text>

  <!-- footer line -->
  <line x1="40" y1="390" x2="1160" y2="390" stroke="#2a2a2a" stroke-width="1"/>
  <text x="40" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#6a6a6a">PORTFOLIO · LINKEDIN · CONTACT</text>
  <text x="1160" y="410" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#6a6a6a">SCROLL</text>
</svg>
